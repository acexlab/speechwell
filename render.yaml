services:
  - type: web
    name: speechwell-backend
    env: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: speechwell-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PORT
        value: 8000
      - key: SPEECHWELL_DATA_DIR
        value: /var/data
      - key: SPEECHWELL_STORAGE_DIR
        value: /var/data/storage
      - key: SQLITE_DB_PATH
        value: /var/data/speechwell.db
      - key: WHISPER_MODEL
        value: base.en
      - key: CHAT_PROVIDER
        value: auto
      - key: GRAMMAR_PROVIDER
        value: local
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
